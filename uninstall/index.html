<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fill in the Blank Generator was removed</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">

<style>
  /* Канон 5.1: страница после удаления — один вопрос «почему удалили», чем проще, тем больше ответов (5–15 %).
     Главное на странице — сам вопрос (слово автора 28.09: «нужно, чтобы главным был вопрос what went wrong?»).
     Интерфейса Google Forms на странице нет: своё поле шлёт ответ прямо в ту же форму (formResponse) —
     ответы ложатся в ту же таблицу. «Мультяшнее» (слово автора 28.09 — для всех страниц): круглый шрифт,
     чернильная обводка, тень-наклейка, каракули по полям. Главное действие — терракотой (дизайн-код, KOD.md). */
  :root{ --bg:#f4efe4; --bg2:#e9e1d0; --ink:#1d1c17; --ink-dim:#6f6a5c; --blue:#2f6b8f; --step:#c46f4c; }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0}
  html{background:var(--bg2)}
  body{
    background:radial-gradient(130% 90% at 50% 0%, var(--bg) 0%, var(--bg2) 70%);
    color:var(--ink);
    font:16px/1.55 Nunito,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:clamp(28px,6vh,64px) 20px 56px;
  }
  .doodles{position:fixed; inset:0; pointer-events:none; z-index:0}
  .doodles svg{position:absolute; color:#c9bca3}
  @media (max-width:1100px){ .doodles{display:none} }
  .removed, h1, .sticker, .failed, .back{position:relative; z-index:1}
  .removed{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:0 0 10px; font-size:15px; font-weight:700; color:var(--ink-dim); text-align:center;
  }
  /* иконка чуть погашена — расширения больше нет */
  .removed img{width:28px; height:28px; flex:none; transform:rotate(-8deg); filter:grayscale(.5) drop-shadow(2px 2px 0 var(--ink)); opacity:.9}
  h1{
    margin:0 0 clamp(22px,4vh,34px); text-align:center;
    font-family:Fredoka,Nunito,sans-serif; font-size:clamp(38px,6.6vw,62px); line-height:1.05; font-weight:700; letter-spacing:-.01em;
  }
  .sticker{ width:100%; max-width:560px; transform:rotate(-.5deg); }
  .card{
    background:#fffdf7; border:3px solid var(--ink); border-radius:20px; box-shadow:7px 7px 0 var(--ink); padding:18px;
  }
  textarea{
    display:block; width:100%; min-height:128px; resize:vertical; margin:0;
    font-family:inherit; font-size:18px; font-weight:700; line-height:1.5; color:var(--ink); background:#f8f3e8;
    border:2px solid #cbbfa7; border-radius:12px; padding:14px 16px;
  }
  textarea::placeholder{color:#716a5a}
  textarea:focus{outline:none; border-color:var(--ink); background:#fff; box-shadow:0 0 0 3px rgba(47,107,143,.25)}
  .row{display:flex; justify-content:flex-end; margin-top:14px}
  button{
    font-family:Fredoka,Nunito,sans-serif; font-weight:600; font-size:19px; line-height:1; color:#fff; background:var(--step);
    border:3px solid var(--ink); border-radius:12px; padding:12px 28px; cursor:pointer;
    box-shadow:4px 4px 0 var(--ink); transition:transform .06s, box-shadow .06s;
  }
  button:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--blue); outline-offset:3px}
  button[aria-disabled="true"]{opacity:.7; cursor:progress}
  .done{padding:30px 10px; text-align:center; font-family:Fredoka,Nunito,sans-serif; font-size:22px; font-weight:600}
  .done:focus{outline:none}
  .failed{margin:18px 0 0; font-size:15px; font-weight:700; color:var(--ink-dim); text-align:center; max-width:46ch}
  .failed a, .back a{color:var(--blue); text-decoration:none; font-weight:800}
  .failed a:hover, .back a:hover{text-decoration:underline}
  /* узкий телефон: иконка над строкой «…was removed», иначе слово уезжает на вторую строку сбоку от иконки */
  @media (max-width:420px){ .removed{flex-direction:column; gap:6px} }
  .back{margin-top:30px; font-size:14px; color:var(--ink-dim); text-align:center}
</style>
  <!-- Umami (автор 29.09): один сайт на все страницы fib-pages — отчёт Pages делит по адресу. Без куки, баннер согласия не нужен.
       data-domains — считать только живой адрес (локальные просмотры и стенды не считаются).
       Хвост адреса пишем: с 1.0.1 расширение кладёт в него, сколько листов успели сделать (?sheets=0|1|2-5|6+) — Umami → Query
       parameters покажет «удалили, не сделав ни одного листа» против «сделали и ушли». Номера человека в адресе нет. -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="8e6299ac-e25b-4cae-90bd-f55cb4569afe" data-domains="panarini.github.io"></script>
</head>
<body>
  <div class="doodles" aria-hidden="true">
    <svg style="left:5%;top:16%;transform:rotate(-14deg)" width="84" height="84" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 52l6-18 26-26 12 12-26 26z"/><path d="M38 14l12 12"/><path d="M12 52l12-4"/></svg>
    <svg style="right:6%;top:14%;transform:rotate(12deg)" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M32 6l7 17 18 1-14 11 5 18-16-10-16 10 5-18L7 24l18-1z"/></svg>
    <svg style="right:8%;bottom:12%;transform:rotate(-8deg)" width="110" height="46" viewBox="0 0 120 50" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 30h22"/><path d="M34 34h44" stroke-width="3.5"/><path d="M86 30h28"/><text x="44" y="24" font-family="Fredoka,sans-serif" font-size="14" fill="currentColor" stroke="none">(1)</text></svg>
    <svg style="left:7%;bottom:14%;transform:rotate(6deg)" width="80" height="50" viewBox="0 0 80 50" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 30c10-20 20 20 30 0s20 20 30 0 10-10 12-6"/></svg>
  </div>

  <p class="removed"><img src="../icon.png" alt="">Fill in the Blank Generator was removed</p>
  <h1 id="q">What went wrong?</h1>

  <div class="sticker"><div class="card">
    <form id="ask">
      <textarea id="answer" aria-labelledby="q" placeholder="One line is enough" maxlength="3000" autofocus></textarea>
      <div class="row"><button type="submit" id="send">Send</button></div>
    </form>
    <div class="done" id="done" role="status" tabindex="-1" hidden>Thank you — we got it.</div>
  </div></div>

  <p class="failed" id="failed" role="alert" hidden>
    It didn’t go through. <a id="mail" href="#">Send it by email instead</a> — your text is already filled in.
  </p>

  <p class="back" id="back" hidden>
    Removed it by mistake? <a id="storelink" href="#" target="_blank" rel="noopener">Install Fill in the Blank Generator again</a>
  </p>

  <script>
    // Ответ уходит в Google-форму автора напрямую (formResponse) — те же ответы, та же таблица, без интерфейса формы
    // (форма автора 28.09, forms.gle/bNm9v7b1TUA9UaML6). ENTRY — номер поля «What went wrong?»; сверен 28.09 подстановкой
    // (viewform?usp=pp_url&entry.…). Правка вопроса в Google Forms может сменить номер — тогда сверить заново.
    // no-cors: ответа Google страница не видит; сеть не ответила — предлагаем письмо с уже вписанным текстом.
    const FORM_ID   = '1FAIpQLSc4ou2bpU8mQAlObFeI82ME1bx2R5lnGUvDrg5iA23FptcdJw';
    const ENTRY     = 'entry.566431948';
    // откуда ответ — пометкой в начале того же ответа: «[uninstall] …» / «[rating 2★] …» (одна таблица на продукт;
    // второго вопроса в форме нет — слово автора 28.09)
    // с 1.0.1 расширение кладёт в адрес грубый счёт своих листов (?sheets=0|1|2-5|6+, background.js) — пометкой в ответ формы:
    // «почему удалил» рядом с «успел ли попробовать» (слово автора 29.09). Без параметра (1.0.0) — как было
    const SHEETS    = (new URLSearchParams(location.search).get('sheets') || '').match(/^(0|1|2-5|6\+)$/);
    const SOURCE    = 'uninstall' + (SHEETS ? ' · ' + SHEETS[1] + (SHEETS[1] === '1' ? ' sheet' : ' sheets') : '');
    const EMAIL     = 'hello@fanarlabs.com';   // тот же адрес, что в политике приватности продукта
    const SUBJECT   = 'Why I removed Fill in the Blank Generator';
    // ID расширения — из кабинета CWS (автор 29.09); до публикации стор отвечает «empty-title», страница удаления до неё и не открывается
    const STORE_URL = 'https://chromewebstore.google.com/detail/cogjebcdchokgfhdbagcgkfeblacndci?utm_source=uninstall_page';

    const form = document.getElementById('ask'), ta = document.getElementById('answer'), send = document.getElementById('send');
    let sending = false;
    // Enter — отправить (ответ в одну строку, как в чате); Shift+Enter — новая строка
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
    });
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const text = ta.value.trim();
      if (sending) return;
      // поле не обязательное (слово автора 03.10): пустой Send — тоже ответ, уходит одна пометка источника «[uninstall · …]»
      // пока идёт отправка: поле только для чтения (иначе правка молча не уйдёт), кнопка не гаснет через disabled —
      // иначе фокус с неё падает на body; повтор держит флаг sending
      sending = true; ta.readOnly = true; send.setAttribute('aria-disabled', 'true'); send.textContent = 'Sending…';
      document.getElementById('failed').hidden = true;
      const body = new URLSearchParams({ [ENTRY]: text ? `[${SOURCE}] ${text}` : `[${SOURCE}]`, fvv: '1', pageHistory: '0' });
      try {
        // keepalive — ответ дойдёт, даже если вкладку закрыли во время отправки;
        // таймаут — зависшая сеть через 10 с уходит в запасной путь письмом, а не держит «Sending…» минуту
        await fetch(`https://docs.google.com/forms/d/e/${FORM_ID}/formResponse`,
          { method: 'POST', mode: 'no-cors', body, keepalive: true, signal: AbortSignal.timeout(10000) });
        form.hidden = true;
        const done = document.getElementById('done');
        done.hidden = false; done.focus();
      } catch (err) {
        document.getElementById('failed').hidden = false;
        ta.readOnly = false; send.removeAttribute('aria-disabled'); send.textContent = 'Send'; sending = false;
      }
    });
    // письмо собирается в момент щелчка — из того, что в поле сейчас
    document.getElementById('mail').addEventListener('click', e => {
      e.currentTarget.href = `mailto:${EMAIL}?subject=${encodeURIComponent(SUBJECT)}&body=${encodeURIComponent(ta.value.trim())}`;
    });
    if (STORE_URL) {
      document.getElementById('storelink').href = STORE_URL;
      document.getElementById('back').hidden = false;
    }
  </script>
</body>
</html>
